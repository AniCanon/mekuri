apply plugin: "maven-publish"

android {
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

// The library has one home; a shared gradle property must not redirect it.
def githubOwner = "AniCanon"
def githubRepository = "mekuri"

def githubUsername = providers.gradleProperty("gpr.user")
    .orElse(providers.environmentVariable("GITHUB_ACTOR"))

def githubToken = providers.gradleProperty("gpr.key")
    .orElse(providers.environmentVariable("GITHUB_TOKEN"))

afterEvaluate {
    publishing {
        publications {
            release(org.gradle.api.publish.maven.MavenPublication) {
                from components.release
                groupId = project.group.toString()
                artifactId = project.name
                version = project.version.toString()

                pom {
                    name = project.name
                    description = "A page-curl pager for Jetpack Compose"
                    licenses {
                        license {
                            name = "MIT"
                            url = "https://opensource.org/licenses/MIT"
                        }
                    }
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/$githubOwner/$githubRepository")

                credentials {
                    username = githubUsername.orNull
                    password = githubToken.orNull
                }
            }
        }
    }
}
